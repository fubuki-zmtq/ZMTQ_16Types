<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMTQ 16Types診断</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --text-color: #e0e1dd;
            --primary-color: #3a86ff;
            --primary-glow: rgba(58, 134, 255, 0.6);
            --secondary-color: #1c2541;
            --highlight: #00f0ff;
            --card-bg: rgba(28, 37, 65, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            /* 画面遷移時のガタつきを防ぐため、常にスクロールバーの領域を確保します */
            overflow-y: scroll;
            overflow-x: hidden;
        }

        /* なめらかな画面遷移用のアニメーション設定 */
        .screen {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .screen.active {
            display: flex;
        }

        .screen.fade-in {
            opacity: 1;
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        h1 {
            color: var(--highlight);
            text-shadow: 0 0 10px var(--primary-glow);
            font-size: 2rem;
        }

        .subtitle {
            margin-bottom: 40px;
            color: var(--primary-color);
            letter-spacing: 4px;
        }

        .highlight {
            color: var(--highlight);
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .button-group.horizontal {
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--primary-color);
            padding: 15px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 0 5px rgba(58, 134, 255, 0.2);
        }

        button:hover {
            background-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-glow);
            color: #fff;
        }

        .back-btn {
            border-color: #666;
            margin-top: 30px;
            max-width: 200px;
        }

        .back-btn:hover {
            background-color: #666;
            box-shadow: none;
        }

        .x-btn {
            border-color: #1DA1F2;
            color: #1DA1F2;
        }

        .x-btn:hover {
            background-color: #1DA1F2;
            box-shadow: 0 0 15px rgba(29, 161, 242, 0.6);
        }

        .content-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* この診断についてのスタイリッシュな装飾 */
        .indicator-box {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        .indicator-box.blue { border-left: 5px solid var(--primary-color); }
        .indicator-box.cyan { border-left: 5px solid var(--highlight); }
        .ind-letter {
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-align: left;
        }
        .blue .ind-letter { color: var(--primary-color); text-shadow: 0 0 15px var(--primary-glow); }
        .cyan .ind-letter { color: var(--highlight); text-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        .ind-short {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }
        .ind-long {
            font-size: 0.95rem;
            color: #bbb;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--secondary-color);
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        #quiz-progress {
            height: 100%;
            background: var(--highlight);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 8px var(--highlight);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 30px;
        }

        .option-btn {
            padding: 12px;
            font-size: 1rem;
        }

        .chart-container {
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .chart-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .chart-row .label {
            width: 30px;
            font-weight: bold;
        }

        .bar-bg {
            flex-grow: 1;
            height: 12px;
            background: #333;
            border-radius: 6px;
            margin: 0 15px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0%;
            transition: width 1s ease-out;
        }

        .k-color, .o-color, .b-color, .t-color { background-color: var(--primary-color); }
        .p-color, .f-color, .s-color, .i-color { background-color: var(--highlight); }

        .small-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 20px;
            padding-left: 45px;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .type-btn {
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .type-code { font-size: 1.2rem; font-weight: bold; color: var(--highlight); }
        .type-job { font-size: 0.9rem; }

        /* モーダル（ポップアップ）のなめらかなアニメーション */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        .close-btn:hover { color: #fff; }

        #transition-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--highlight);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="transition-overlay">
        <div class="loader"></div>
        <p>診断結果を分析中...</p>
    </div>

    <div id="home-screen" class="screen active fade-in">
        <h1 id="home-title">ZMTQ 16Types診断</h1>
        <p class="subtitle">from ZETA MYTH TREE QUEST</p>
        <div class="button-group">
            <button onclick="startQuiz()">診断を始める</button>
            <button onclick="navigate('about-screen')">この診断について</button>
            <button onclick="navigate('list-screen')">タイプ一覧</button>
        </div>
    </div>

    <div id="about-screen" class="screen">
        <h2>この診断について</h2>
        <div class="content-box">
            <p>「もし自分がZMTQ世界に存在するとしたら、どのような役割を担う人物になるのか」をテーマとするエンターテインメントコンテンツです。</p>
            <p>職業は単純な能力ではなく、4つの価値観の組み合わせによって決定されます。</p>
        </div>
        <div id="about-indicators" style="width: 100%;"></div>
        <button class="back-btn" onclick="navigate('home-screen')">ホームに戻る</button>
    </div>

    <div id="list-screen" class="screen">
        <h2>16タイプ一覧</h2>
        <div id="type-grid" class="type-grid"></div>
        <button class="back-btn" onclick="navigate('home-screen')">ホームに戻る</button>
    </div>

    <div id="type-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-code-job"></h3>
            <p id="modal-title" class="highlight"></p>
            <p id="modal-desc"></p>
            <div id="modal-indicators" class="indicator-mini"></div>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="progress-bar-container">
            <div id="quiz-progress"></div>
        </div>
        <p id="question-counter">1 / 32</p>
        <h2 id="question-text">質問文がここに入ります</h2>
        <div class="options-container">
            <button class="option-btn" onclick="selectAnswer(4)">とてもそう思う</button>
            <button class="option-btn" onclick="selectAnswer(2)">そう思う</button>
            <button class="option-btn" onclick="selectAnswer(1)">少しそう思う</button>
            <button class="option-btn" onclick="selectAnswer(-1)">あまりそう思わない</button>
            <button class="option-btn" onclick="selectAnswer(-2)">そう思わない</button>
            <button class="option-btn" onclick="selectAnswer(-4)">全くそう思わない</button>
        </div>
        <button class="back-btn" onclick="navigate('home-screen')">ホームに戻る</button>
    </div>

    <div id="result-screen" class="screen">
        <h2 id="result-code"></h2>
        <h3 id="result-job"></h3>
        <p id="result-title" class="highlight"></p>
        <div class="content-box">
            <p id="result-desc"></p>
        </div>
        
        <div class="chart-container">
            <div class="chart-row"><span class="label">K</span><div class="bar-bg"><div id="bar-kp-k" class="bar k-color"></div></div><span id="pct-k"></span></div>
            <div class="chart-row"><span class="label">P</span><div class="bar-bg"><div id="bar-kp-p" class="bar p-color"></div></div><span id="pct-p"></span></div>
            <p id="desc-kp" class="small-desc"></p>

            <div class="chart-row"><span class="label">O</span><div class="bar-bg"><div id="bar-of-o" class="bar o-color"></div></div><span id="pct-o"></span></div>
            <div class="chart-row"><span class="label">F</span><div class="bar-bg"><div id="bar-of-f" class="bar f-color"></div></div><span id="pct-f"></span></div>
            <p id="desc-of" class="small-desc"></p>

            <div class="chart-row"><span class="label">B</span><div class="bar-bg"><div id="bar-bs-b" class="bar b-color"></div></div><span id="pct-b"></span></div>
            <div class="chart-row"><span class="label">S</span><div class="bar-bg"><div id="bar-bs-s" class="bar s-color"></div></div><span id="pct-s"></span></div>
            <p id="desc-bs" class="small-desc"></p>

            <div class="chart-row"><span class="label">T</span><div class="bar-bg"><div id="bar-ti-t" class="bar t-color"></div></div><span id="pct-t"></span></div>
            <div class="chart-row"><span class="label">I</span><div class="bar-bg"><div id="bar-ti-i" class="bar i-color"></div></div><span id="pct-i"></span></div>
            <p id="desc-ti" class="small-desc"></p>
        </div>

        <div class="button-group horizontal">
            <button class="x-btn" onclick="shareOnX()">Xで共有</button>
            <button onclick="startQuiz()">もう一度診断する</button>
            <button class="back-btn" onclick="navigate('home-screen')">ホームに戻る</button>
        </div>
    </div>

    <!-- ここに外部ファイルを読み込みます -->
    <script src="types.js"></script>
    <script src="questions.js"></script>
    
    <script>
        const APP_TITLE = "ZMTQ16Types診断";
        document.getElementById('home-title').innerText = APP_TITLE;

        let shuffledQuestions = [];
        let currentQIndex = 0;
        let scores = { K: 0, P: 0, O: 0, F: 0, B: 0, S: 0, T: 0, I: 0 };
        let answerHistory = {};

        // 画面遷移ロジック（ローディングの有無を指定可能に改善）
        function navigate(targetScreenId, showLoading = false, callback = null) {
            const current = document.querySelector('.screen.active');
            
            if (current) {
                // 現在の画面をフェードアウト
                current.classList.remove('fade-in');
                setTimeout(() => {
                    current.classList.remove('active');
                    processNextStep();
                }, 300); // 0.3秒待機
            } else {
                processNextStep();
            }

            function processNextStep() {
                if (showLoading) {
                    const overlay = document.getElementById('transition-overlay');
                    overlay.style.display = 'flex';
                    void overlay.offsetWidth; // 強制リフロー
                    overlay.style.opacity = '1';

                    if (callback) callback();

                    // 2秒後にローディング画面を消して次へ
                    setTimeout(() => {
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                            showTargetScreen();
                        }, 500);
                    }, 2000);
                } else {
                    if (callback) callback();
                    showTargetScreen();
                }
            }

            function showTargetScreen() {
                const target = document.getElementById(targetScreenId);
                target.classList.add('active');
                void target.offsetWidth; // 強制リフロー
                target.classList.add('fade-in');
                window.scrollTo(0, 0); // 遷移時に一番上に戻す
            }
        }

        window.onload = () => {
            generateAboutPage();
            generateTypeList();
        };

        function generateAboutPage() {
            const container = document.getElementById('about-indicators');
            let html = '';
            // K, O, B, Tを青系、P, F, S, Iをシアン系に色分け
            const colors = { K: 'blue', P: 'cyan', O: 'blue', F: 'cyan', B: 'blue', S: 'cyan', T: 'blue', I: 'cyan' };
            
            for(const [key, val] of Object.entries(indicatorDesc)) {
                html += `
                <div class="indicator-box ${colors[key]}">
                    <h3 class="ind-letter">${key}</h3>
                    <p class="ind-short">${val.short}</p>
                    <p class="ind-long">${val.long}</p>
                </div>`;
            }
            container.innerHTML = html;
        }

        function generateTypeList() {
            const grid = document.getElementById('type-grid');
            for(const [code, data] of Object.entries(typesDB)) {
                const btn = document.createElement('button');
                btn.className = 'type-btn';
                btn.innerHTML = `<span class="type-code">${code}</span><span class="type-job">${data.job}</span>`;
                btn.onclick = () => showTypeModal(code);
                grid.appendChild(btn);
            }
        }

        function showTypeModal(code) {
            const data = typesDB[code];
            document.getElementById('modal-code-job').innerText = `${code} ${data.job}`;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-desc').innerHTML = data.desc;
            
            let indHtml = '';
            const letters = code.split('');
            letters.forEach(l => {
                indHtml += `<p><strong>${l}</strong>: ${indicatorDesc[l].short}</p>`;
            });
            document.getElementById('modal-indicators').innerHTML = indHtml;

            // アニメーションを伴って表示
            document.getElementById('type-modal').classList.add('active');
        }

        function closeModal() {
            // アニメーションを伴って非表示
            document.getElementById('type-modal').classList.remove('active');
        }

        function startQuiz() {
            scores = { K: 0, P: 0, O: 0, F: 0, B: 0, S: 0, T: 0, I: 0 };
            answerHistory = {};
            currentQIndex = 0;
            
            shuffledQuestions = [...questionsData].sort(() => Math.random() - 0.5);
            
            navigate('quiz-screen', false, loadQuestion);
        }

        function loadQuestion() {
            if(currentQIndex >= shuffledQuestions.length) {
                // ここは呼ばれませんが安全のため残します
                calculateResult();
                return;
            }
            
            const q = shuffledQuestions[currentQIndex];
            document.getElementById('question-counter').innerText = `${currentQIndex + 1} / ${shuffledQuestions.length}`;
            document.getElementById('question-text').innerText = q.text;
            
            const progress = (currentQIndex / shuffledQuestions.length) * 100;
            document.getElementById('quiz-progress').style.width = `${progress}%`;
        }

        function getOppositeTarget(target) {
            const pairs = { K: 'P', P: 'K', O: 'F', F: 'O', B: 'S', S: 'B', T: 'I', I: 'T' };
            return pairs[target];
        }

        function selectAnswer(point) {
            const q = shuffledQuestions[currentQIndex];
            const opposite = getOppositeTarget(q.target);
            
            const actualTarget = point > 0 ? q.target : opposite;
            const absPoint = Math.abs(point);
            
            scores[actualTarget] += absPoint;
            answerHistory[q.id] = { target: actualTarget, point: absPoint };
            
            currentQIndex++;
            if(currentQIndex >= shuffledQuestions.length) {
                document.getElementById('quiz-progress').style.width = '100%';
                // 最後の質問に答えたら、ローディングを挟んで結果画面へ遷移
                navigate('result-screen', true, calculateResult);
            } else {
                loadQuestion();
            }
        }

        function resolveAxis(sideA, sideB, axisCode) {
            if (scores[sideA] > scores[sideB]) return sideA;
            if (scores[sideB] > scores[sideA]) return sideB;

            const tb = tiebreakers[axisCode];
            let repScoreA = 0, repScoreB = 0;
            
            tb.rep.forEach(id => {
                if(answerHistory[id].target === sideA) repScoreA += answerHistory[id].point;
                if(answerHistory[id].target === sideB) repScoreB += answerHistory[id].point;
            });

            if (repScoreA > repScoreB) return sideA;
            if (repScoreB > repScoreA) return sideB;

            if(answerHistory[tb.final].target === sideA) return sideA;
            return sideB;
        }

        function calculateResult() {
            const resK = resolveAxis('K', 'P', 'KP');
            const resO = resolveAxis('O', 'F', 'OF');
            const resB = resolveAxis('B', 'S', 'BS');
            const resT = resolveAxis('T', 'I', 'TI');
            
            const finalCode = resK + resO + resB + resT;
            renderResult(finalCode);
        }

        function getPercent(sideA, sideB) {
            const total = scores[sideA] + scores[sideB];
            if (total === 0) return 50;
            return Math.round((scores[sideA] / total) * 100);
        }

        function renderResult(code) {
            const data = typesDB[code];
            document.getElementById('result-code').innerText = code;
            document.getElementById('result-job').innerText = data.job;
            document.getElementById('result-title').innerText = data.title;
            document.getElementById('result-desc').innerHTML = data.desc;

            const pctK = getPercent('K', 'P'); const pctP = 100 - pctK;
            const pctO = getPercent('O', 'F'); const pctF = 100 - pctO;
            const pctB = getPercent('B', 'S'); const pctS = 100 - pctB;
            const pctT = getPercent('T', 'I'); const pctI = 100 - pctT;

            setTimeout(() => {
                document.getElementById('bar-kp-k').style.width = `${pctK}%`;
                document.getElementById('bar-kp-p').style.width = `${pctP}%`;
                document.getElementById('bar-of-o').style.width = `${pctO}%`;
                document.getElementById('bar-of-f').style.width = `${pctF}%`;
                document.getElementById('bar-bs-b').style.width = `${pctB}%`;
                document.getElementById('bar-bs-s').style.width = `${pctS}%`;
                document.getElementById('bar-ti-t').style.width = `${pctT}%`;
                document.getElementById('bar-ti-i').style.width = `${pctI}%`;
            }, 100);

            document.getElementById('pct-k').innerText = `${pctK}%`;
            document.getElementById('pct-p').innerText = `${pctP}%`;
            document.getElementById('pct-o').innerText = `${pctO}%`;
            document.getElementById('pct-f').innerText = `${pctF}%`;
            document.getElementById('pct-b').innerText = `${pctB}%`;
            document.getElementById('pct-s').innerText = `${pctS}%`;
            document.getElementById('pct-t').innerText = `${pctT}%`;
            document.getElementById('pct-i').innerText = `${pctI}%`;

            const letters = code.split('');
            document.getElementById('desc-kp').innerText = `${letters[0]} : ${indicatorDesc[letters[0]].short}`;
            document.getElementById('desc-of').innerText = `${letters[1]} : ${indicatorDesc[letters[1]].short}`;
            document.getElementById('desc-bs').innerText = `${letters[2]} : ${indicatorDesc[letters[2]].short}`;
            document.getElementById('desc-ti').innerText = `${letters[3]} : ${indicatorDesc[letters[3]].short}`;
        }

        function shareOnX() {
            const code = document.getElementById('result-code').innerText;
            const job = document.getElementById('result-job').innerText;
            const title = document.getElementById('result-title').innerText;
            const url = window.location.href;
            const hashtag = APP_TITLE.replace(/\s+/g, '');

            const shareText = `${code}\n${job}\n${title}\n${APP_TITLE}\n${url}\n#${hashtag}`;
            const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
            
            window.open(xUrl, '_blank');
        }
    </script>
</body>
</html>
