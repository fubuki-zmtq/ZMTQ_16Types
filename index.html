<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMTQ 16Types診断</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b132b;
            --text-color: #e0e1dd;
            --primary-color: #0262AE;
            --primary-glow: rgba(2, 98, 174, 0.6);
            --secondary-color: #1c2541;
            --highlight: #FFFF46;
            --highlight-glow: rgba(255, 255, 70, 0.6);
            --card-bg: rgba(28, 37, 65, 0.8);
            --font-main: 'Noto Sans JP', sans-serif;
            --font-bebas: 'Bebas Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-y: scroll;
            overflow-x: hidden;
        }

        .screen {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .screen.active {
            display: flex;
        }

        .screen.fade-in {
            opacity: 1;
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        h1 {
            color: var(--highlight);
            text-shadow: 0 0 10px var(--highlight-glow);
            line-height: 1.1;
        }

        .title-main {
            font-family: var(--font-bebas);
            font-size: 6rem;
            letter-spacing: 5px;
        }

        .title-sub {
            font-family: var(--font-main);
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .subtitle {
            margin-bottom: 40px;
            color: var(--primary-color);
            letter-spacing: 4px;
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--primary-glow);
        }

        .highlight-text {
            color: var(--highlight);
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 0 0 8px var(--highlight-glow);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .button-group.horizontal {
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--primary-color);
            padding: 15px 20px;
            font-size: 1rem;
            font-family: var(--font-main);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 0 5px rgba(2, 98, 174, 0.2);
        }

        button:hover {
            background-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-glow);
            color: #fff;
        }

        .back-btn {
            border-color: #666;
            color: #ccc;
            max-width: 200px;
            box-shadow: none;
            margin-top: 15px;
        }

        .back-btn:hover {
            background-color: #444;
            border-color: #444;
            color: #fff;
        }

        .x-btn {
            border-color: #1DA1F2;
            color: #1DA1F2;
        }

        .x-btn:hover {
            background-color: #1DA1F2;
            box-shadow: 0 0 15px rgba(29, 161, 242, 0.6);
            color: #fff;
        }

        .content-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .indicator-pair {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (min-width: 600px) {
            .indicator-pair {
                flex-direction: row;
            }
            .indicator-box {
                flex: 1;
                margin-bottom: 0 !important;
            }
        }

        .indicator-box {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            text-align: left;
            margin-bottom: 15px;
        }
        .indicator-box.blue { border-top: 4px solid var(--primary-color); }
        .indicator-box.yellow { border-top: 4px solid var(--highlight); }
        
        .ind-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        .ind-letter {
            font-family: var(--font-bebas);
            font-size: 2.8rem;
            line-height: 1;
        }
        .blue .ind-letter { color: var(--primary-color); text-shadow: 0 0 10px var(--primary-glow); }
        .yellow .ind-letter { color: var(--highlight); text-shadow: 0 0 10px var(--highlight-glow); }
        
        .ind-full {
            font-family: var(--font-bebas);
            font-size: 1.2rem;
            color: #aaa;
            letter-spacing: 2px;
        }

        .ind-short {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .ind-long {
            font-size: 0.85rem;
            color: #bbb;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--secondary-color);
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        #quiz-progress {
            height: 100%;
            background: var(--highlight);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 8px var(--highlight-glow);
        }

        .question-wrapper {
            width: 100%;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .question-wrapper.fade-out {
            opacity: 0;
        }

        #question-text {
            font-size: 1.3rem;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            word-break: auto-phrase;
        }

        .diamond-options-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 40px;
        }

        .labels-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
            font-weight: 700;
            color: #ddd;
            font-size: 0.95rem;
        }

        .diamonds-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }

        .diamond-btn {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            margin: -10px;
        }

        .diamond-btn:hover {
            background: transparent !important;
            box-shadow: none !important;
        }

        .diamond-shape {
            background-color: transparent;
            transform: rotate(45deg);
            transition: all 0.2s ease;
        }

        .diamond-left .diamond-shape {
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 5px var(--primary-glow);
        }
        .diamond-btn:hover .diamond-left .diamond-shape {
            background-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: rotate(45deg) scale(1.2);
        }

        .diamond-right .diamond-shape {
            border: 2px solid var(--highlight);
            box-shadow: 0 0 5px var(--highlight-glow);
        }
        .diamond-btn:hover .diamond-right .diamond-shape {
            background-color: var(--highlight);
            box-shadow: 0 0 15px var(--highlight-glow);
            transform: rotate(45deg) scale(1.2);
        }

        .size-large .diamond-shape { width: 36px; height: 36px; }
        .size-medium .diamond-shape { width: 28px; height: 28px; }
        .size-small .diamond-shape { width: 20px; height: 20px; }

        #result-code {
            font-family: var(--font-bebas);
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 20px var(--highlight-glow), 0 0 40px var(--primary-glow);
            letter-spacing: 8px;
            margin-bottom: 0;
            line-height: 1.2;
        }

        #result-job {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--highlight);
            margin-bottom: 15px;
        }

        #result-title {
            font-size: 1.1rem;
            color: var(--highlight);
            font-weight: 700;
            background: rgba(2, 98, 174, 0.4);
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 10px rgba(2, 98, 174, 0.5);
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 25px;
            display: inline-block;
        }

        .chart-container {
            width: 100%;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .single-bar-row {
            margin-bottom: 20px;
        }

        .bar-labels {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-bebas);
            font-size: 1.5rem;
            margin-bottom: 5px;
            line-height: 1;
        }
        
        .label-left { color: var(--primary-color); text-shadow: 0 0 5px var(--primary-glow); }
        .label-right { color: var(--highlight); text-shadow: 0 0 5px var(--highlight-glow); }
        .pct-text { font-family: var(--font-main); font-size: 1rem; margin: 0 8px; color: #fff; text-shadow: none;}

        .single-bar-bg {
            width: 100%;
            height: 18px;
            background: #222;
            border-radius: 9px;
            overflow: hidden;
            display: flex;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .bar-left-fill {
            height: 100%;
            background: linear-gradient(90deg, #00C6FF, var(--primary-color));
            box-shadow: 0 0 10px var(--primary-glow);
            transition: width 1s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .bar-right-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--highlight), #FFA500);
            box-shadow: 0 0 10px var(--highlight-glow);
            transition: width 1s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .type-btn {
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .type-code { font-family: var(--font-bebas); font-size: 1.8rem; color: var(--highlight); letter-spacing: 2px;}
        .type-job { font-size: 0.95rem; font-weight: 700;}

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 30px var(--primary-glow);
            padding: 35px 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #888;
            transition: color 0.2s;
        }

        .close-btn:hover { color: #fff; }

        #transition-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--highlight);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="transition-overlay">
        <div class="loader"></div>
        <p>診断結果を分析中...</p>
    </div>

    <div id="home-screen" class="screen active fade-in">
        <h1 id="home-title">
            <span class="title-main">ZMTQ</span><br>
            <span class="title-sub">16Types診断</span>
        </h1>
        <p class="subtitle">from ZETA MYTH TREE QUEST</p>
        <div class="button-group">
            <button onclick="startQuiz()">診断を始める</button>
            <button onclick="navigate('about-screen')">この診断について</button>
            <button onclick="navigate('list-screen')">タイプ一覧</button>
        </div>
    </div>

    <div id="about-screen" class="screen">
        <h2>この診断について</h2>
        <div class="content-box">
            <p>「もし自分がZMTQ世界に存在するとしたら、どのような役割を担う人物になるのか」をテーマとするエンターテインメントコンテンツです。</p>
            <p>職業は単純な能力ではなく、4つの価値観の組み合わせによって決定されます。</p>
        </div>
        <div id="about-indicators" style="width: 100%;"></div>
        <button class="back-btn" onclick="navigate('home-screen')">ホームに戻る</button>
    </div>

    <div id="list-screen" class="screen">
        <h2>16タイプ一覧</h2>
        <div id="type-grid" class="type-grid"></div>
        <button class="back-btn" onclick="navigate('home-screen')">ホームに戻る</button>
    </div>

    <div id="type-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-code-job" style="color: var(--highlight); margin-bottom: 10px; text-align: center;"></div>
            <p id="modal-title" class="highlight-text"></p>
            <p id="modal-desc"></p>
            <div id="modal-indicators" class="indicator-mini" style="margin-top: 20px; font-size: 0.9rem; color: #ccc;"></div>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="progress-bar-container">
            <div id="quiz-progress"></div>
        </div>
        <p id="question-counter" style="font-family: var(--font-bebas); font-size: 1.5rem; color: #888; letter-spacing: 2px;">1 / 32</p>
        
        <div id="q-wrapper" class="question-wrapper">
            <h2 id="question-text"></h2>
            
            <div class="diamond-options-container">
                <div class="labels-row">
                    <span style="color: var(--primary-color); text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);">そう思う</span>
                    <span style="color: var(--highlight);">そう思わない</span>
                </div>
                <div class="diamonds-row">
                    <button class="diamond-btn diamond-left size-large" onclick="selectAnswer(4)" title="とてもそう思う"><div class="diamond-shape"></div></button>
                    <button class="diamond-btn diamond-left size-medium" onclick="selectAnswer(2)" title="そう思う"><div class="diamond-shape"></div></button>
                    <button class="diamond-btn diamond-left size-small" onclick="selectAnswer(1)" title="少しそう思う"><div class="diamond-shape"></div></button>
                    
                    <button class="diamond-btn diamond-right size-small" onclick="selectAnswer(-1)" title="あまりそう思わない"><div class="diamond-shape"></div></button>
                    <button class="diamond-btn diamond-right size-medium" onclick="selectAnswer(-2)" title="そう思わない"><div class="diamond-shape"></div></button>
                    <button class="diamond-btn diamond-right size-large" onclick="selectAnswer(-4)" title="全くそう思わない"><div class="diamond-shape"></div></button>
                </div>
            </div>
        </div>
        
        <div style="display: flex; gap: 15px; width: 100%; max-width: 400px; margin-top: 20px; flex-direction: column; align-items: center;">
            <button id="back-q-btn" class="back-btn" onclick="goBackQuestion()" style="margin-top: 0; width: 100%;">前の質問に戻る</button>
            <button class="back-btn" onclick="navigate('home-screen')" style="margin-top: 0; width: 100%;">ホームに戻る</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2 id="result-code"></h2>
        <h3 id="result-job"></h3>
        <p id="result-title"></p>
        <div class="content-box">
            <p id="result-desc"></p>
        </div>
        
        <div class="chart-container">
            <div class="single-bar-row">
                <div class="bar-labels">
                    <span class="label-left">K <span class="pct-text" id="pct-k"></span></span>
                    <span class="label-right"><span class="pct-text" id="pct-p"></span> P</span>
                </div>
                <div class="single-bar-bg">
                    <div id="bar-k" class="bar-left-fill" style="width: 50%;"></div>
                    <div id="bar-p" class="bar-right-fill" style="width: 50%;"></div>
                </div>
                <p id="desc-kp" class="small-desc" style="margin-top: 5px; padding-left: 0; text-align: center; color: #aaa; font-size: 0.85rem;"></p>
            </div>

            <div class="single-bar-row">
                <div class="bar-labels">
                    <span class="label-left">O <span class="pct-text" id="pct-o"></span></span>
                    <span class="label-right"><span class="pct-text" id="pct-f"></span> F</span>
                </div>
                <div class="single-bar-bg">
                    <div id="bar-o" class="bar-left-fill" style="width: 50%;"></div>
                    <div id="bar-f" class="bar-right-fill" style="width: 50%;"></div>
                </div>
                <p id="desc-of" class="small-desc" style="margin-top: 5px; padding-left: 0; text-align: center; color: #aaa; font-size: 0.85rem;"></p>
            </div>

            <div class="single-bar-row">
                <div class="bar-labels">
                    <span class="label-left">B <span class="pct-text" id="pct-b"></span></span>
                    <span class="label-right"><span class="pct-text" id="pct-s"></span> S</span>
                </div>
                <div class="single-bar-bg">
                    <div id="bar-b" class="bar-left-fill" style="width: 50%;"></div>
                    <div id="bar-s" class="bar-right-fill" style="width: 50%;"></div>
                </div>
                <p id="desc-bs" class="small-desc" style="margin-top: 5px; padding-left: 0; text-align: center; color: #aaa; font-size: 0.85rem;"></p>
            </div>

            <div class="single-bar-row">
                <div class="bar-labels">
                    <span class="label-left">T <span class="pct-text" id="pct-t"></span></span>
                    <span class="label-right"><span class="pct-text" id="pct-i"></span> I</span>
                </div>
                <div class="single-bar-bg">
                    <div id="bar-t" class="bar-left-fill" style="width: 50%;"></div>
                    <div id="bar-i" class="bar-right-fill" style="width: 50%;"></div>
                </div>
                <p id="desc-ti" class="small-desc" style="margin-top: 5px; padding-left: 0; text-align: center; color: #aaa; font-size: 0.85rem;"></p>
            </div>
        </div>

        <div class="button-group horizontal">
            <button class="x-btn" onclick="shareOnX()">Xで共有</button>
            <button onclick="startQuiz()">もう一度診断する</button>
            <button class="back-btn" onclick="navigate('home-screen')">ホームに戻る</button>
        </div>
    </div>

    <script src="types.js"></script>
    <script src="questions.js"></script>
    
    <script>
        const APP_TITLE = "ZMTQ 16Types診断";

        let shuffledQuestions = [];
        let currentQIndex = 0;
        let scores = { K: 0, P: 0, O: 0, F: 0, B: 0, S: 0, T: 0, I: 0 };
        let answerHistory = {};

        function navigate(targetScreenId, showLoading = false, callback = null) {
            const current = document.querySelector('.screen.active');
            
            if (current) {
                current.classList.remove('fade-in');
                setTimeout(() => {
                    current.classList.remove('active');
                    processNextStep();
                }, 300);
            } else {
                processNextStep();
            }

            function processNextStep() {
                if (showLoading) {
                    const overlay = document.getElementById('transition-overlay');
                    overlay.style.display = 'flex';
                    void overlay.offsetWidth;
                    overlay.style.opacity = '1';

                    if (callback) callback();

                    setTimeout(() => {
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                            showTargetScreen();
                        }, 500);
                    }, 2000);
                } else {
                    if (callback) callback();
                    showTargetScreen();
                }
            }

            function showTargetScreen() {
                const target = document.getElementById(targetScreenId);
                target.classList.add('active');
                void target.offsetWidth;
                target.classList.add('fade-in');
                window.scrollTo(0, 0);
            }
        }

        window.onload = () => {
            generateAboutPage();
            generateTypeList();
        };

        const indicatorFull = {
            K: "Knowledge", P: "Power", O: "Order", F: "Freedom",
            B: "Bond", S: "Self", T: "Tradition", I: "Innovation"
        };

        function generateAboutPage() {
            const container = document.getElementById('about-indicators');
            const pairs = [['K', 'P'], ['O', 'F'], ['B', 'S'], ['T', 'I']];
            let html = '';
            
            pairs.forEach(pair => {
                html += `<div class="indicator-pair">`;
                pair.forEach(key => {
                    const val = indicatorDesc[key];
                    const colorClass = (key === 'K' || key === 'O' || key === 'B' || key === 'T') ? 'blue' : 'yellow';
                    html += `
                    <div class="indicator-box ${colorClass}">
                        <div class="ind-header">
                            <span class="ind-letter">${key}</span>
                            <span class="ind-full">${indicatorFull[key]}</span>
                        </div>
                        <p class="ind-short">${val.short}</p>
                        <p class="ind-long">${val.long}</p>
                    </div>`;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function generateTypeList() {
            const grid = document.getElementById('type-grid');
            for(const [code, data] of Object.entries(typesDB)) {
                const btn = document.createElement('button');
                btn.className = 'type-btn';
                btn.innerHTML = `<span class="type-code">${code}</span><span class="type-job">${data.job}</span>`;
                btn.onclick = () => showTypeModal(code);
                grid.appendChild(btn);
            }
        }

        function showTypeModal(code) {
            const data = typesDB[code];
            document.getElementById('modal-code-job').innerHTML = `<span style="font-family: var(--font-bebas); font-size: 2.5rem; margin-right: 15px; vertical-align: middle;">${code}</span><span style="font-size: 1.5rem; font-weight: bold; vertical-align: middle;">${data.job}</span>`;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-desc').innerHTML = data.desc;
            
            let indHtml = '';
            const letters = code.split('');
            letters.forEach(l => {
                indHtml += `<p><strong style="font-family: var(--font-bebas); font-size: 1.2rem; margin-right: 5px;">${l}</strong>: ${indicatorDesc[l].short}</p>`;
            });
            document.getElementById('modal-indicators').innerHTML = indHtml;

            document.getElementById('type-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('type-modal').classList.remove('active');
        }

        function startQuiz() {
            scores = { K: 0, P: 0, O: 0, F: 0, B: 0, S: 0, T: 0, I: 0 };
            answerHistory = {};
            currentQIndex = 0;
            
            shuffledQuestions = [...questionsData].sort(() => Math.random() - 0.5);
            
            navigate('quiz-screen', false, () => {
                document.getElementById('q-wrapper').classList.remove('fade-out');
                loadQuestion();
            });
        }

        function loadQuestion() {
            if(currentQIndex >= shuffledQuestions.length) return;
            
            const q = shuffledQuestions[currentQIndex];
            document.getElementById('question-counter').innerText = `${currentQIndex + 1} / ${shuffledQuestions.length}`;
            document.getElementById('question-text').innerText = q.text;
            
            const progress = (currentQIndex / shuffledQuestions.length) * 100;
            document.getElementById('quiz-progress').style.width = `${progress}%`;

            if(currentQIndex === 0) {
                document.getElementById('back-q-btn').style.display = 'none';
            } else {
                document.getElementById('back-q-btn').style.display = 'block';
            }
        }

        function goBackQuestion() {
            if(currentQIndex > 0) {
                currentQIndex--;
                const prevQ = shuffledQuestions[currentQIndex];
                
                const history = answerHistory[prevQ.id];
                scores[history.target] -= history.point;
                delete answerHistory[prevQ.id];

                const wrapper = document.getElementById('q-wrapper');
                wrapper.classList.add('fade-out');
                
                setTimeout(() => {
                    loadQuestion();
                    wrapper.classList.remove('fade-out');
                }, 300);
            }
        }

        function getOppositeTarget(target) {
            const pairs = { K: 'P', P: 'K', O: 'F', F: 'O', B: 'S', S: 'B', T: 'I', I: 'T' };
            return pairs[target];
        }

        function selectAnswer(point) {
            const wrapper = document.getElementById('q-wrapper');
            wrapper.classList.add('fade-out');

            const q = shuffledQuestions[currentQIndex];
            const opposite = getOppositeTarget(q.target);
            const actualTarget = point > 0 ? q.target : opposite;
            const absPoint = Math.abs(point);
            
            scores[actualTarget] += absPoint;
            answerHistory[q.id] = { target: actualTarget, point: absPoint };
            
            currentQIndex++;
            
            setTimeout(() => {
                if(currentQIndex >= shuffledQuestions.length) {
                    document.getElementById('quiz-progress').style.width = '100%';
                    navigate('result-screen', true, calculateResult);
                } else {
                    loadQuestion();
                    wrapper.classList.remove('fade-out');
                }
            }, 300);
        }

        function resolveAxis(sideA, sideB, axisCode) {
            if (scores[sideA] > scores[sideB]) return sideA;
            if (scores[sideB] > scores[sideA]) return sideB;

            const tb = tiebreakers[axisCode];
            let repScoreA = 0, repScoreB = 0;
            
            tb.rep.forEach(id => {
                if(answerHistory[id] && answerHistory[id].target === sideA) repScoreA += answerHistory[id].point;
                if(answerHistory[id] && answerHistory[id].target === sideB) repScoreB += answerHistory[id].point;
            });

            if (repScoreA > repScoreB) return sideA;
            if (repScoreB > repScoreA) return sideB;

            if(answerHistory[tb.final] && answerHistory[tb.final].target === sideA) return sideA;
            return sideB;
        }

        function calculateResult() {
            const resK = resolveAxis('K', 'P', 'KP');
            const resO = resolveAxis('O', 'F', 'OF');
            const resB = resolveAxis('B', 'S', 'BS');
            const resT = resolveAxis('T', 'I', 'TI');
            
            const finalCode = resK + resO + resB + resT;
            renderResult(finalCode);
        }

        function getPercent(sideA, sideB) {
            const total = scores[sideA] + scores[sideB];
            if (total === 0) return 50;
            return Math.round((scores[sideA] / total) * 100);
        }

        function renderResult(code) {
            const data = typesDB[code];
            document.getElementById('result-code').innerText = code;
            document.getElementById('result-job').innerText = data.job;
            document.getElementById('result-title').innerText = data.title;
            document.getElementById('result-desc').innerHTML = data.desc;

            const pctK = getPercent('K', 'P'); const pctP = 100 - pctK;
            const pctO = getPercent('O', 'F'); const pctF = 100 - pctO;
            const pctB = getPercent('B', 'S'); const pctS = 100 - pctB;
            const pctT = getPercent('T', 'I'); const pctI = 100 - pctT;

            setTimeout(() => {
                document.getElementById('bar-k').style.width = `${pctK}%`;
                document.getElementById('bar-p').style.width = `${pctP}%`;
                
                document.getElementById('bar-o').style.width = `${pctO}%`;
                document.getElementById('bar-f').style.width = `${pctF}%`;
                
                document.getElementById('bar-b').style.width = `${pctB}%`;
                document.getElementById('bar-s').style.width = `${pctS}%`;
                
                document.getElementById('bar-t').style.width = `${pctT}%`;
                document.getElementById('bar-i').style.width = `${pctI}%`;
            }, 100);

            document.getElementById('pct-k').innerText = `${pctK}%`;
            document.getElementById('pct-p').innerText = `${pctP}%`;
            document.getElementById('pct-o').innerText = `${pctO}%`;
            document.getElementById('pct-f').innerText = `${pctF}%`;
            document.getElementById('pct-b').innerText = `${pctB}%`;
            document.getElementById('pct-s').innerText = `${pctS}%`;
            document.getElementById('pct-t').innerText = `${pctT}%`;
            document.getElementById('pct-i').innerText = `${pctI}%`;

            const letters = code.split('');
            document.getElementById('desc-kp').innerHTML = `<span style="font-family: var(--font-bebas); font-size: 1.2rem;">${letters[0]}</span> : ${indicatorDesc[letters[0]].short}`;
            document.getElementById('desc-of').innerHTML = `<span style="font-family: var(--font-bebas); font-size: 1.2rem;">${letters[1]}</span> : ${indicatorDesc[letters[1]].short}`;
            document.getElementById('desc-bs').innerHTML = `<span style="font-family: var(--font-bebas); font-size: 1.2rem;">${letters[2]}</span> : ${indicatorDesc[letters[2]].short}`;
            document.getElementById('desc-ti').innerHTML = `<span style="font-family: var(--font-bebas); font-size: 1.2rem;">${letters[3]}</span> : ${indicatorDesc[letters[3]].short}`;
        }

        function shareOnX() {
            const code = document.getElementById('result-code').innerText;
            const job = document.getElementById('result-job').innerText;
            const url = "https://fubuki-zmtq.github.io/ZMTQ_16Types/";
            const hashtag = "ZMTQ16Types診断";

            const shareText = `私のZMTQ16Types診断は…【${code}】${job}でした！\n\n${url}\n#${hashtag}`;
            const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
            
            window.open(xUrl, '_blank');
        }
    </script>
